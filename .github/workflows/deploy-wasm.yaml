name: Deploy Portfolio Wasm

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build and deploy Wasm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Compose Wasm production distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: composeApp/build/dist/wasmJs/productionExecutable/
          TARGET: /var/www/portfolio
          ARGS: -rlgoDzvc --delete